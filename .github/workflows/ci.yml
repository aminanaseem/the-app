name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Install Linear MCP server deps (tested from repo root)
        working-directory: mcp-server/linear
        run: npm ci
      - run: npm test
      - run: npm run build