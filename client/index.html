<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The App — Todos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Todos</h1>
      <div id="error-banner" class="error-banner" hidden></div>
      <form id="add-form">
        <input id="new-todo" type="text" placeholder="What needs to be done?" autocomplete="off" maxlength="200" />
        <button type="submit" id="add-btn">Add</button>
      </form>
      <ul id="todo-list"></ul>
      <p id="clear-wrap" hidden>
        <button type="button" id="clear-completed" class="text-btn">Clear completed</button>
      </p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
